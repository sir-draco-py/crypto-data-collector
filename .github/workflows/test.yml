name: Run Automated Tests

# Defines the events that trigger the workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install clean dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run the test suite
      - name: Execute Tests
        run: npm test
